name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deploy-frontend:
    name: Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: client
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel --prod --yes --token "$VERCEL_TOKEN"
          else
            vercel --yes --token "$VERCEL_TOKEN"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    name: Backend (Railway)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Redeploy on Railway
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"a230bb7b-1a57-429a-a5d9-31177b3791bc\", environmentId: \"f0913629-e62c-4023-8d15-fd90e2cc0cf0\") }"}' \
            https://backboard.railway.app/graphql/v2
