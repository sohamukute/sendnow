      <div class="seo-landing">
        <h1>SendNow — Free Instant File Transfer Between Any Devices</h1>
        <p>
          SendNow is a free, browser-based file transfer tool that lets you send files, photos, videos,
          and text between any devices on the same WiFi network — no login, no app install, no cloud upload.
          It works like AirDrop but for everyone: iPhone to Android, Windows to Mac, phone to laptop.
        </p>

        <h2>How to send files without an app</h2>
        <ol>
          <li>Open <strong>sendnowp2p.vercel.app</strong> on both devices (same WiFi or mobile hotspot).</li>
          <li>Your devices appear automatically in the device list.</li>
          <li>Click a device, then drop a file or paste text to send it instantly.</li>
        </ol>

        <h2>Features</h2>
        <ul>
          <li>No login, no sign-up, no email required</li>
          <li>No file size limit — limited only by your network</li>
          <li>Peer-to-peer: files never touch our servers</li>
          <li>Works on iPhone, Android, Windows, Mac, Linux</li>
          <li>Send files, photos, videos, links, and notes</li>
          <li>Share with someone outside your WiFi using a room code</li>
          <li>AirDrop alternative that works across all platforms</li>
          <li>Completely free — no ads, no premium tier</li>
        </ul>

        <h2>Frequently Asked Questions</h2>

        <h3>Is there a file size limit?</h3>
        <p>No. Files transfer directly between browsers over WebRTC so there is no server limit. You are limited only by your network speed and device memory.</p>

        <h3>Does it work between iPhone and Android?</h3>
        <p>Yes. Any modern browser works — Chrome, Safari, Firefox. SendNow is the cross-platform AirDrop alternative that works between any devices regardless of operating system.</p>

        <h3>Can I send files to someone not on my WiFi?</h3>
        <p>Yes. Click "Invite via link" to get a room code. Share it with anyone and they can join from any network. The transfer still goes peer-to-peer through an encrypted relay.</p>

        <h3>Are my files private?</h3>
        <p>Your files never pass through our servers. They travel directly from one browser to the other using WebRTC encryption. We have zero access to what you send.</p>

        <h3>What can I send?</h3>
        <p>Any file type — photos, videos, PDFs, zip archives, documents — plus plain text notes and links. Paste text directly into the text box and send it instantly.</p>

        <p>
          SendNow is open source and free forever. A fast, private alternative to WeTransfer, SendAnywhere,
          Snapdrop, and Sharedrop for local network file sharing.
        </p>
